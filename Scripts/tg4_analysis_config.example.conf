# TG4 requires a named, predeclared experimental convention. The repository
# supplies no canonical Fibonacci ratios, Fibonacci tolerance, or TG1B
# referenceBarScale. Replace every REQUIRED_EXPERIMENTAL_VALUE before use and
# describe the external decision in provenance. Do not select values using
# 2025 results.
configuration_schema=tg4-analysis-configuration-v1
name=REQUIRED_EXPERIMENTAL_VALUE
provenance=experimental convention; REQUIRED_EXPERIMENTAL_VALUE

# The existing production market-data path uses canonical 15-minute candles.
# A different interval is permitted only as another explicit configuration.
timeframe=15m
candle_period=15
candle_unit=minute
expected_interval_seconds=900
material_gap_multiple=1.5
minimum_human_report_resolved_n=20
max_pending_tg4_records=4096

# TG1A defaults/contracts as implemented at the audited baseline.
tg1_fractal_semantics=strict_five_completed_candles_radius_2
tg1_intervening_price_tolerance=0
tg1_touch_price_tolerance=0
tg1_max_fractal_anchor_lookback_bars=512
tg1_max_confirmed_fractals_per_kind=64
tg1_max_candidate_age_bars=512
tg1_max_candidates=4096
tg1_atr_period=14

# No repository source defines this scale; caller must freeze it in advance.
tg1b_reference_bar_scale=REQUIRED_EXPERIMENTAL_VALUE
tg1b_angle_bands=long_term_12_20_outer_25_40_inner_45_85_degrees_inclusive

# TG2 defaults/contracts as implemented at the audited baseline.
tg2_break_policy=completed_close_beyond_line
tg2_rearm_policy=completed_bar_returns_to_valid_side
tg2_retest_contact_policy=wick_reaches_projected_line_from_broken_side
tg2_outer_pairing_policy=nearest_coexisting_outer_beyond_break_candle
tg2_break_price_tolerance=0
tg2_retest_price_tolerance=0
tg2_outer_target_price_tolerance=0
tg2_retest_horizon_bars=20
tg2_outer_target_horizon_bars=20
tg2_max_active_break_observations=4096
tg2_max_retained_break_observations=4096

# TG3 has no source-supported canonical ratio set or tolerance.
tg3_ab_policy=most_recent_prior_opposite_confirmed_fractal
tg3_retracement_ratios=REQUIRED_EXPERIMENTAL_VALUE
tg3_ratio_provenance=experimental convention; REQUIRED_EXPERIMENTAL_VALUE
tg3_absolute_price_tolerance=REQUIRED_EXPERIMENTAL_VALUE
tg3_confluence_policy=absolute_price_tolerance_around_exact_retracement_level
tg3_directional_study_policy=source_utl_up_ab_only
tg3_max_confirmed_fractals_per_kind=128
tg3_max_ab_age_bars=2048
tg3_max_active_ab_structures=512
tg3_max_active_confluence_observations=4096
tg3_max_retained_confluence_observations=4096
